[project]
site_name = "influencer"
site_url = "https://javwiki.github.io/influencer/"
site_description = "社交媒体创作者与公众人物资料索引。"
site_author = "Mark Chen"
repo_url = "https://github.com/javwiki/influencer"
repo_name = "javwiki/influencer"
edit_uri = "edit/main/docs/"
use_directory_urls = true

[project.theme]
variant = "classic"
language = "zh"
features = [
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

# Follow the user's system color preference by default.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "跟随系统设置"

[project.plugins.tags]
