[project]
site_name = "influencer"
site_url = "https://javwiki.github.io/influencer/"
site_description = "社交媒体创作者与公众人物资料索引。"
site_author = "Mark Chen"
repo_url = "https://github.com/javwiki/influencer"
repo_name = "javwiki/influencer"
edit_uri = "edit/main/docs/"
use_directory_urls = true

[project.theme]
variant = "classic"
language = "zh"
# 首字母目录使用 navigation.indexes：字母 index.md 作为该字母的目录节点，
# 条目作为其子级缩进显示（不再与目录页平级）。
features = [
  "navigation.instant",
  "navigation.path",
  "navigation.indexes",
  "navigation.top",
  "search.highlight",
]

# Follow the user's system color preference by default.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "跟随系统设置"

[project.plugins.tags]
